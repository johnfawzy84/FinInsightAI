server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Content Security Policy:
  # - forbids eval/new Function (no 'unsafe-eval')
  # - allows selected external CDNs used for libs (adjust domains as needed)
  # - report-uri/report-to for monitoring violations (replace example.com with your reporting host)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://aistudiocdn.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.example.com wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; report-uri /csp-report-endpoint; report-to csp-endpoint;" always;

  # Report-To header (modern reporting). Replace the endpoint URL to your monitoring endpoint.
  add_header Report-To '{"group":"csp-endpoint","max_age":10886400,"endpoints":[{"url":"https://example.com/csp-report-endpoint"}]}' always;

  # Additional security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

  # Endpoint to receive CSP reports (report-uri). This simply returns 204 and
  # prevents log spamming — replace with a real collector if you want to store reports.
  location = /csp-report-endpoint {
    client_max_body_size 1M;
    add_header Content-Type application/json;
    return 204;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
