name: Smart Rebase docker-deploy

on:
  push:
    branches:
      - docker-deploy
  workflow_dispatch:

jobs:
  smart-rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: docker-deploy
          fetch-depth: 0 # Need full history for rebasing
          # Use a Personal Access Token (PAT) so the push triggers other workflows
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Smart Rebase Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install
          node smart-rebase.js