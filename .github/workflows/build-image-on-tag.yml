name: Build Docker image on tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (example: v1.2.3 or release-2026-01)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.event.inputs.tag, 'v') || startsWith(github.event.inputs.tag, 'release-')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fininsight:${{ github.event.inputs.tag }}

      - name: Export image to tar
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/fininsight:${{ github.event.inputs.tag }}
          docker image save -o image.tar "$IMAGE"

      - name: Save image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.event.inputs.tag }}
          path: |
            ./image.tar
